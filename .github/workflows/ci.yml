name: checks
# verify: every pull request and every push to main, its parts side by side (below). It is the check main
# requires, so it runs in every run of this workflow, even a cancelled one: a skipped job counts as passed, and every
# run must report a real verify (a pull request that changes no Rust skips its Rust parts or finishes them in seconds).
# parity: the vanilla harnesses a pull request's changes can affect, on the Mac mini's runner, which holds the
# maintainer's own Minecraft files (Horizon never downloads the game); .github/workflows/parity.yml. Only for a pull
# request that changes a harness, oracle, probe or the runner: the rest are checked on main by parity-main. A fork's pull
# request runs it only when a maintainer adds the run-parity label (.github/workflows/run-parity.yml), so labels
# never start this workflow. See docs/release-flow.md.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  # The merge queue: main plus the queued pull requests ahead, checked as main's pushes are (the whole workspace).
  # verify is the check the queue waits for; parity and the pull request's crate selection skip it.
  merge_group:
    types: [checks_requested]
  # A maintainer's try run of any branch here, without a pull request (docs/ci-runners.md#try-runs):
  # `gh workflow run checks --ref <branch>` runs verify's parts on main's disks, which it never saves; the inputs add
  # the jobs below that run by hand only. A fork cannot start it: dispatching takes write access to this repository.
  workflow_dispatch:
    inputs:
      jfr:
        description: Also run the JFR analysis on the Linux game runner
        type: boolean
        default: false
permissions:
  contents: read
  # The push run asks whether the merge queue's run of the same commit passed (the `queued` steps).
  actions: read
concurrency:
  # A new push to a pull request replaces its running checks. On main, the running check finishes and only the
  # newest push waits behind it: GitHub cancels a waiting run when a newer one joins the group. A burst of merges
  # queued ~100 main runs on 2026-11-09; the release follows the newest finished main run (docs/release-flow.md).
  group: checks-${{ github.event.pull_request.number || (github.event_name == 'push' && 'main') || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  # Whether a job saves its build folder's sticky disk (see verify below). Only main's pushes and the merge queue do;
  # every pull request, a fork's too, and every hand-started run (any branch's) starts from what they built and its
  # changes are discarded, so nothing a branch builds reaches main's disk. Forks once had a disk of their own, but
  # pull_request jobs never save one (Blacksmith refuses), so it stayed empty and every fork's pull request built the
  # workspace from scratch: 7-10 min per Rust part on 2026-11-17, against ~2 min for a branch of this repository on
  # main's disk.
  SAVE_BUILD_DISK: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'merge_group') && 'true' || 'false' }}

jobs:
  # verify runs as one job per part, side by side, so a run takes as long as its slowest part, not the sum. It was two
  # jobs (the three short parts as steps of one) while GitHub's 20 concurrent jobs were what a burst of pull requests
  # waited for; Blacksmith's runners are not in that pool. #18004's runs, both cold: the two jobs took 13.7 and 5.2
  # min, the first with its 32 cores mostly idle (clippy 5.5, the server build's clippy 3.0, the Python tests 1.9, one
  # after another).
  # `verify` itself is the check main requires: it waits for the parts and passes only when each passed or had nothing
  # to do. It runs even in a cancelled run (`always()`), so it fails there instead of being skipped, which GitHub
  # would count as passed. A failed part re-runs alone ("Re-run failed jobs"), not the others.
  # Each part's last step prints a load line (tools/ci/load_probe.sh) for choosing runner sizes.
  #
  # Where (docs/ci-runners.md): Blacksmith's runners (blacksmith.sh sponsors our minutes), each part on a size that
  # fits it, for every pull request (a fork's once a maintainer approves it), the merge queue and main's pushes. They are
  # GitHub's own image on faster machines, but report themselves as self-hosted, so the steps tell them apart by
  # runner.name. The repository variable SELF_HOSTED_CI=all sends every part to our checks runners (label
  # horizon-checks), whose build folder persists (CARGO_TARGET_DIR, outside the checkout).
  # On Blacksmith each Rust part keeps its build folder on a sticky disk instead (tools/ci/build_folder.sh), one disk per
  # part: parts that ran side by side on one disk would each replace the other's build. A cold disk builds everything
  # once; after that a pull request rebuilds what it changed.
  # Which parts a change reaches, decided on the smallest runner before the Rust parts start: a part that starts only to
  # find nothing to do still bills a whole minute of its runner (#18843).
  # Every Rust part waits for it, so each starts 10-16 s later; the decision itself takes under a second. Only the
  # scripts it runs are checked out: `git grep` of a revision (the mod points' search of file contents) reads the whole
  # tree whatever the sparse checkout leaves out, and fetches the blobs it needs.
  verify-scope:
    name: verify (which parts run)
    runs-on: ${{ vars.SELF_HOSTED_CI == 'all' && fromJSON('["self-hosted", "linux", "horizon-checks"]') || 'blacksmith-2vcpu-ubuntu-2404' }}
    timeout-minutes: 10
    outputs:
      rust: ${{ steps.answers.outputs.rust }}
      mod_points: ${{ steps.answers.outputs.mod_points }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: tools
          persist-credentials: false
      # The Rust parts' answers: `required` (needs_rust) for the lint, server build and Rust tests parts, `mod_points`
      # for the mod points part. Only a pull request asks; on any other event every Rust part runs.
      - name: Does this pull request need Rust checks?
        if: github.event_name == 'pull_request'
        id: rust
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/ci/rust_changes.py "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
      # Each answer exactly `true` or `false`: the parts' `if`s compare without case, the gate with it. No answer (a
      # step that didn't run) means the part runs; anything else fails this job, and so verify.
      - name: Every answer is true or false
        id: answers
        env:
          RUST: ${{ steps.rust.outputs.required }}
          MOD_POINTS: ${{ steps.rust.outputs.mod_points }}
        run: |
          for answer in "rust=$RUST" "mod_points=$MOD_POINTS"; do
            name=${answer%%=*} value=${answer#*=}
            case "$value" in
              true | false) ;;
              '') value=true ;;
              *) echo "::error::$name: '$value' is neither true nor false"; exit 1 ;;
            esac
            echo "$name=$value" | tee -a "$GITHUB_OUTPUT"
          done
  verify-tree:
    name: verify (tree and Python tests)
    runs-on: ${{ vars.SELF_HOSTED_CI == 'all' && fromJSON('["self-hosted", "linux", "horizon-checks"]') || 'blacksmith-8vcpu-ubuntu-2404' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # A push reads every historical table's bytes (`--history`, #17605). Without them in the clone, git fetches
          # each one on its own, which takes over 30 minutes; the full clone reads them in about 7.
          filter: ${{ github.event_name != 'push' && 'blob:none' || '' }}
      # The merge queue merges with merge commits and main moves to the exact commit its merge_group run verified, so
      # that commit's push run would repeat a finished, green verify. Only a green merge_group run of this very commit
      # counts; an admin merge never had one, and an API error counts as not tested, so the push then verifies in full.
      - name: Did the merge queue already verify this commit?
        id: queued
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          tested=false
          if n=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?event=merge_group&head_sha=$SHA&status=success&per_page=1" --jq .total_count 2>/dev/null) && [ "${n:-0}" -ge 1 ]; then
            tested=true
          fi
          echo "tested=$tested" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: startsWith(runner.name, 'blacksmith-')
        with:
          python-version: '3.12'
      # A pull request or a merge group adds only its own commits to main, so it reads those; a push to main that the
      # merge queue didn't verify reads the whole history reachable from HEAD.
      - name: Keep game artifacts out of Git
        if: steps.queued.outputs.tested != 'true'
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          python tools/check_public_tree.py
          if [ "$EVENT" = pull_request ] || [ "$EVENT" = merge_group ]; then
            python tools/check_public_tree.py --range "$BASE_SHA..$HEAD_SHA"
          else
            # Our own runners reuse their clone, which keeps its blob filter: fetch the blobs once in one pack.
            if [ "$(git config --get remote.origin.promisor)" = true ]; then
              git fetch --quiet --refetch --no-filter origin "$GITHUB_SHA"
            fi
            python tools/check_public_tree.py --history
          fi
      # Some Python tests compile Rust with a bare `rustc` (GitHub's image has a default toolchain, our runners' own
      # rustup homes may not), so a pull request's verify doesn't depend on which pool took it (#8627).
      - name: Our runners as GitHub's (a default Rust toolchain)
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      # On a pull request, the next two checks compare with HEAD^1: the main that GitHub's merge commit puts the pull
      # request on. pull_request.base.sha is main at the pull request's last push and falls behind, so main's own
      # changes since then would count as the pull request's (#13874).
      # docs/layers.md: a crate depends only on its own layer or a lower one; today's exceptions only shrink.
      - name: Crates follow the layers
        if: steps.queued.outputs.tested != 'true'
        env:
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
        run: python3 tools/check_layers.py ${BASE:+--base "$BASE"}
      # docs/layers.md#built-in-addresses: every built-in outside address in the Horizon layer's home; the rest only shrinks.
      - name: Built-in addresses stay in their home
        if: steps.queued.outputs.tested != 'true'
        env:
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
        run: python3 tools/check_addresses.py ${BASE:+--base "$BASE"}
      # A nested workspace's Cargo.lock goes stale when a crate it reaches outside its folder changes its dependencies,
      # and only its own build, after the merge, would notice (tools/ci/nested_locks.py). Index only, no compiling; it
      # runs only when a resolution input changed against the event's base: the main GitHub's merge commit sits on
      # (HEAD^1), the merge group's base_sha, or main before the push. No base (a manual run, a new branch): it runs.
      # Only cargo's --locked mismatch fails it; a registry it cannot reach is a warning.
      - name: Nested Cargo.lock files match the crates they reach
        if: steps.queued.outputs.tested != 'true'
        env:
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.merge_group.base_sha || github.event.before || '' }}
        run: python3 tools/ci/nested_locks.py ${BASE:+--base "$BASE"}
      # One module per process, on every core: in one process the suite took ~2 minutes.
      - name: Test offline research tooling
        if: steps.queued.outputs.tested != 'true'
        run: python tools/ci/unittest_parallel.py
      - name: Load probe
        if: always()
        continue-on-error: true
        run: timeout -k 5 10 tools/ci/load_probe.sh || echo "The load probe did not run"
  # Format and lint are not in the merge queue: every pull request passed them on its own head, and main's push after
  # the merge still runs clippy (a combination that breaks a lint shows there). A commit the queue verified skips the
  # format check but still runs clippy. A pull request that changes no Rust skips it (verify-scope).
  verify-lint:
    name: verify (format and lint)
    needs: verify-scope
    if: github.event_name != 'merge_group' && needs.verify-scope.outputs.rust != 'false'
    runs-on: ${{ vars.SELF_HOSTED_CI == 'all' && fromJSON('["self-hosted", "linux", "horizon-checks"]') || 'blacksmith-16vcpu-ubuntu-2404' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Did the merge queue already verify this commit?
        id: queued
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          tested=false
          if n=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?event=merge_group&head_sha=$SHA&status=success&per_page=1" --jq .total_count 2>/dev/null) && [ "${n:-0}" -ge 1 ]; then
            tested=true
          fi
          echo "tested=$tested" >> "$GITHUB_OUTPUT"
      - name: Install Rust toolchain
        env:
          HOSTED: ${{ startsWith(runner.name, 'blacksmith-') }}
        run: tools/ci/install_rust.sh
      - name: Mount the build folder
        if: startsWith(runner.name, 'blacksmith-')
        uses: useblacksmith/stickydisk@3f6be1451e3cad893b778bc93495c80452a5da26 # v1.7.2
        with:
          key: ${{ github.repository }}-verify-lint-own
          path: ~/horizon-target
          commit: ${{ env.SAVE_BUILD_DISK }}
      - name: Build in it, rebuilding only what changed
        if: startsWith(runner.name, 'blacksmith-')
        run: tools/ci/build_folder.sh ~/horizon-target
      - name: Check formatting and lint
        env:
          TESTED: ${{ steps.queued.outputs.tested }}
        run: |
          [ "$TESTED" = true ] || cargo +stable fmt --all -- --check
          cargo +stable clippy --workspace --all-targets --locked -- -D warnings
      - name: Load probe
        if: always()
        continue-on-error: true
        run: timeout -k 5 10 tools/ci/load_probe.sh || echo "The load probe did not run"
  # The server build (released as horizon-engine): the dedicated game. Its libraries and binaries,
  # not the tests and examples verify-lint checks. Every pull request that changes Rust runs it, whatever crate the
  # change is in (tools/ci/rust_changes.py's server_build answer goes unread on purpose): the merge queue doesn't, so a
  # change that breaks only the server build must stop on its own pull request (a crate below the client can break it
  # without touching one).
  # 4 vCPU: its clippy keeps about two cores busy (load 1-3, 8-19% of 16 cores on 39 pull requests, 2026-11-20).
  verify-server:
    name: verify (server build lint)
    needs: verify-scope
    if: github.event_name != 'merge_group' && needs.verify-scope.outputs.rust != 'false'
    runs-on: ${{ vars.SELF_HOSTED_CI == 'all' && fromJSON('["self-hosted", "linux", "horizon-checks"]') || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Install Rust toolchain
        env:
          HOSTED: ${{ startsWith(runner.name, 'blacksmith-') }}
        run: tools/ci/install_rust.sh
      - name: Mount the build folder
        if: startsWith(runner.name, 'blacksmith-')
        uses: useblacksmith/stickydisk@3f6be1451e3cad893b778bc93495c80452a5da26 # v1.7.2
        with:
          key: ${{ github.repository }}-verify-server-own
          path: ~/horizon-target
          commit: ${{ env.SAVE_BUILD_DISK }}
      - name: Build in it, rebuilding only what changed
        if: startsWith(runner.name, 'blacksmith-')
        run: tools/ci/build_folder.sh ~/horizon-target
      - name: Lint the server build
        run: cargo +stable clippy -p myriade-engine --lib --bins --locked --no-default-features -- -D warnings
      - name: Load probe
        if: always()
        continue-on-error: true
        run: timeout -k 5 10 tools/ci/load_probe.sh || echo "The load probe did not run"
  verify-test:
    name: verify (Rust tests)
    needs: verify-scope
    if: needs.verify-scope.outputs.rust != 'false'
    runs-on: ${{ vars.SELF_HOSTED_CI == 'all' && fromJSON('["self-hosted", "linux", "horizon-checks"]') || 'blacksmith-16vcpu-ubuntu-2404' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Did the merge queue already verify this commit?
        id: queued
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          tested=false
          if n=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?event=merge_group&head_sha=$SHA&status=success&per_page=1" --jq .total_count 2>/dev/null) && [ "${n:-0}" -ge 1 ]; then
            tested=true
          fi
          echo "tested=$tested" >> "$GITHUB_OUTPUT"
      # Before the next step, so that the toolchain downloads beside apt and the next step finds it installed.
      - name: Install Rust toolchain and the mold linker
        env:
          HOSTED: ${{ startsWith(runner.name, 'blacksmith-') }}
        run: tools/ci/install_rust.sh mold
      # As in verify-tree: a default toolchain, so a part doesn't depend on which pool took it.
      - name: Our runners as GitHub's (a default Rust toolchain)
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Mount the build folder
        if: startsWith(runner.name, 'blacksmith-')
        uses: useblacksmith/stickydisk@3f6be1451e3cad893b778bc93495c80452a5da26 # v1.7.2
        with:
          key: ${{ github.repository }}-verify-test-own
          path: ~/horizon-target
          commit: ${{ env.SAVE_BUILD_DISK }}
      - name: Build in it, rebuilding only what changed
        if: startsWith(runner.name, 'blacksmith-')
        run: tools/ci/build_folder.sh ~/horizon-target
      # The mold linker, Blacksmith's runners only (installed above): linking the test binaries was a large part of this
      # job. Rust uses its own lld on x86_64 Linux by default; -linker-features=-lld turns that off so mold's
      # -fuse-ld applies. The same on every event, so the build folder's artifacts match between main and pull requests.
      # The variable replaces .cargo/config.toml's rustflags, so it repeats the parallel front end (-Zthreads=8).
      - name: Link with mold
        if: startsWith(runner.name, 'blacksmith-')
        run: echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS=-C linker-features=-lld -C link-arg=-fuse-ld=mold -Zthreads=8" >> "$GITHUB_ENV"
      # Libraries, binaries and integration tests, then doc tests: not the ~275 examples, which verify-lint's clippy
      # type-checks and the parity job builds and runs (they were most of this step's build and link time).
      # cargo test --locked, not nextest: nextest's process per test reloads each binary's shared tables for every test, and on
      # these 4-core runners it was no faster (#4978).
      # Every event tests the whole workspace, pull requests included. A pull request used to test only its crates and
      # their dependents (`-p`, tools/ci/test_scope.py), but Cargo resolves features for the packages selected: `-p
      # horizon-core` builds libc, serde, syn and proc-macro2 with other features than `--workspace`, so a scoped run
      # rebuilt its whole selection from the bottom and never reused main's build in the build folder. With the folder
      # warm, the workspace build costs only what changed; running every test costs ~35 s (#18025's cold run: unit
      # tests 17 s, content-root 4 s, doc tests 13 s).
      - name: Test Rust core and voxel kernel correctness
        env:
          TESTED: ${{ steps.queued.outputs.tested }}
          # main's pushes record per-crate build times (#18047); the later runs rebuild nothing, so only the first has it.
          TIMINGS: ${{ github.ref == 'refs/heads/main' && '--timings' || '' }}
        run: |
          # A commit the queue already tested is only built, with the same arguments, so the build folder keeps main's build.
          if [ "$TESTED" = true ]; then
            cargo +stable test --locked --workspace --lib --bins --tests --no-run $TIMINGS
            exit 0
          fi
          cargo +stable test --locked --workspace --lib --bins --tests $TIMINGS
          # The full content-root tests (#[ignore]d: minutes each on a laptop). The same build as above; they need the
          # prepared vanilla data, so without it they pass at once. Keep the target selection identical to avoid
          # recompiling the workspace with a different dependency graph.
          cargo +stable test --locked --workspace --lib --bins --tests mod_content::tests:: -- --ignored
          cargo +stable test --locked --workspace --doc
      - name: Upload the cargo build timings
        # Also after a failed test: the build, and so its timings, finished before the tests ran.
        if: "!cancelled() && github.ref == 'refs/heads/main'"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cargo-timings
          path: ${{ env.CARGO_TARGET_DIR || 'target' }}/cargo-timings/cargo-timing-*.html
          if-no-files-found: warn
          retention-days: 30
      - name: Load probe
        if: always()
        continue-on-error: true
        run: timeout -k 5 10 tools/ci/load_probe.sh || echo "The load probe did not run"
  # docs/layers.md#mod-points-stay-put: every eligible `Game` method is a mod injection point, so a change to `Game`'s
  # source or to the generator must leave the point catalog and the generated API as they were. A point's name,
  # target and signature are part of the mod API: a removed or changed point or any other change to the generated API
  # fails, and a new hook adds points and passes (--allow-added). It builds horizon-mod-api-gen's hook_snapshot example
  # for the pull request's tree (the merge commit) and for HEAD^1 (main, as in verify-tree): the generator's few
  # crates and their dependencies, not the game. A pull request runs it when tools/ci/rust_changes.py says its change
  # can reach the points (`mod_points`: the game module, the generator's crates, the check, manifests, or a Rust file
  # that mentions `replaceable` before or after; verify-scope asks); the rest never start it.
  # 8 vCPU: the generator and the comparison run on one core (2-10 min of a run), and only the compiles use more (the
  # wire loopback's 25-77 s, a missing base snapshot's ~55 s more), so 16 cores sat mostly idle. 4 vCPU may do: its
  # load probe below has no lines yet.
  # It is its own job beside verify-test, with a build folder of its own, so it adds no time to the slowest job (as a
  # step of verify-test it came after the tests and added ~2.5 min to every pull request that touches game/). Like
  # verify-test it runs on every event, because only main's pushes and the merge queue save a build folder's disk:
  # there it only warms the folder (below), and pull requests compare. It needs the history for HEAD^1, so the
  # checkout is whole, as the other parts'.
  verify-mod-points:
    name: verify (mod points)
    needs: verify-scope
    if: needs.verify-scope.outputs.mod_points != 'false'
    runs-on: ${{ vars.SELF_HOSTED_CI == 'all' && fromJSON('["self-hosted", "linux", "horizon-checks"]') || 'blacksmith-8vcpu-ubuntu-2404' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          # Nothing later pushes, and the pull request's code runs from here on: it needs no token.
          persist-credentials: false
      # apt beside rustup (tools/ci/install_rust.sh), as verify-test: one after the other they took 10-18 s here.
      - name: Install Rust toolchain and the mold linker
        env:
          HOSTED: ${{ startsWith(runner.name, 'blacksmith-') }}
        run: tools/ci/install_rust.sh mold
      - name: Our runners as GitHub's (a default Rust toolchain)
        run: rustup default stable
      - name: Mount the build folder
        if: startsWith(runner.name, 'blacksmith-')
        uses: useblacksmith/stickydisk@3f6be1451e3cad893b778bc93495c80452a5da26 # v1.7.2
        with:
          key: ${{ github.repository }}-verify-mod-points-own
          path: ~/horizon-target
          commit: ${{ env.SAVE_BUILD_DISK }}
      - name: Build in it, rebuilding only what changed
        if: startsWith(runner.name, 'blacksmith-')
        run: tools/ci/build_folder.sh ~/horizon-target
      # The same mold flags as verify-test's.
      - name: Link with mold
        if: startsWith(runner.name, 'blacksmith-')
        run: echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS=-C linker-features=-lld -C link-arg=-fuse-ld=mold -Zthreads=8" >> "$GITHUB_ENV"
      # On main's pushes and in the merge queue, where the build folder's disk is saved (SAVE_BUILD_DISK), the job only
      # builds what the check builds: the same cargo package, example, profile and features, in this folder, so a pull
      # request's run finds the generator's crates and dependencies built. A pull request does the comparison.
      # On Blacksmith those runs also run the generator and keep this commit's snapshot on the disk
      # (mod-points-snapshots, by commit), and a pull request whose HEAD^1 is stored compares with it instead of
      # building the base: the base side took 135-281 s in every pull request (#18840). Pull requests mount the disk
      # but never save it (Blacksmith refuses), so none can leave a snapshot for another; our checks runners keep what
      # a job leaves in the build folder, so there nothing is stored or read. Likewise the compiled layouts the surface
      # report compares (wire-layouts, by commit), which also leaves the API crates built for a pull request's head.
      - name: Warm the build folder with the generator, and keep this commit's mod points snapshot
        if: github.event_name != 'pull_request'
        env:
          STORE: ${{ env.SAVE_BUILD_DISK == 'true' && startsWith(runner.name, 'blacksmith-') }}
        run: |
          if [ "$STORE" = true ]; then
            python3 tools/check_mod_points_unchanged.py --store-snapshot "$CARGO_TARGET_DIR/mod-points-snapshots"
            # Only main's pushes store compiled layouts, not the merge queue: a baseline is main's own code.
            if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
              python3 tools/ci/surface_report.py --store-layouts "$CARGO_TARGET_DIR/wire-layouts"
            else
              cargo build --locked -p horizon-mod-api --example wire_layouts
            fi
          else
            cargo build --locked -p horizon-mod-api-gen --example hook_snapshot
            cargo build --locked -p horizon-mod-api --example wire_layouts
          fi
      - name: Mod points and the generated API stay as they were
        if: github.event_name == 'pull_request'
        env:
          HOSTED: ${{ startsWith(runner.name, 'blacksmith-') }}
        run: |
          if [ "$HOSTED" = true ]; then
            python3 tools/check_mod_points_unchanged.py --base HEAD^1 --allow-added --snapshots "$CARGO_TARGET_DIR/mod-points-snapshots"
          else
            python3 tools/check_mod_points_unchanged.py --base HEAD^1 --allow-added
          fi
      # The mod API surface of the merge base and of this tree, diffed (tools/ci/surface_report.py). With
      # tools/ci/surface.toml's gate on, a breaking change that no new note in crates/horizon-mod-vocab/changes/ names
      # fails, and so does a change that makes the game refuse wasm mods built before it: a changed wire layout of a
      # type that crosses, or an argument added to a hook (the point check above compares the generated text, which
      # shows neither). horizon-stage is built from the package and profile the check built hook_snapshot from. The
      # compiled layouts of HEAD^1 come from the store main's pushes fill, or are built by checking it out here, with its
      # own wire_layouts example, and then this commit again: this step runs after the point check, and the wire
      # loopback after it builds this commit. A base without the example is compared by source alone, with a warning.
      - name: The mod API keeps what mods built before it use
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.rust.outputs.mod_points != 'false' }}
        env:
          EVENT: ${{ github.event_name }}
        run: |
          cargo build --locked --quiet -p horizon-mod-api-gen --bin horizon-stage
          HORIZON_STAGE_TOOL="${CARGO_TARGET_DIR:-$PWD/target}/debug/horizon-stage" \
            WIRE_LAYOUTS_STORE="${CARGO_TARGET_DIR:-$PWD/target}/wire-layouts" python3 tools/ci/surface_report.py
      # verify-test builds the points' wire loopback empty: it needs a guest build whose table has sites (#18400).
      - name: The points' wire loopback
        run: cargo test --locked -p horizon-mod-points --features wasm-guest,listener-fixture --test wire_loopback
      - name: Load probe
        if: always()
        continue-on-error: true
        run: timeout -k 5 10 tools/ci/load_probe.sh || echo "The load probe did not run"
  verify:
    needs: [verify-scope, verify-tree, verify-lint, verify-server, verify-test, verify-mod-points]
    if: always()
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Every part of verify passed or had nothing to do
        env:
          SCOPE: ${{ needs.verify-scope.result }}
          TREE: ${{ needs.verify-tree.result }}
          LINT: ${{ needs.verify-lint.result }}
          SERVER: ${{ needs.verify-server.result }}
          TEST: ${{ needs.verify-test.result }}
          MODPOINTS: ${{ needs.verify-mod-points.result }}
          EVENT: ${{ github.event_name }}
          RUST_ANSWER: ${{ needs.verify-scope.outputs.rust }}
          MODPOINTS_ANSWER: ${{ needs.verify-scope.outputs.mod_points }}
        # A skipped part passes only where its own `if` left it out: verify-scope's answer for it exactly `false`
        # (compared with case, as `if` doesn't), or, for the parts the merge queue leaves out (lint, server build),
        # the merge queue. Anywhere else it was never decided for (verify-scope failed, or the run was
        # cancelled first), which fails.
        run: |
          echo "which parts run: $SCOPE, tree and Python tests: $TREE, format and lint: $LINT, server build: $SERVER, Rust tests: $TEST, mod points: $MODPOINTS"
          [ "$SCOPE" = success ] || exit 1
          [ "$TREE" = success ] || [ "$TREE" = skipped ] || exit 1
          left_out() { [ "$EVENT" = merge_group ] || [ "$1" = false ]; }
          [ "$LINT" = success ] || { [ "$LINT" = skipped ] && left_out "$RUST_ANSWER"; } || exit 1
          [ "$SERVER" = success ] || { [ "$SERVER" = skipped ] && left_out "$RUST_ANSWER"; } || exit 1
          [ "$TEST" = success ] || { [ "$TEST" = skipped ] && [ "$RUST_ANSWER" = false ]; } || exit 1
          [ "$MODPOINTS" = success ] || { [ "$MODPOINTS" = skipped ] && [ "$MODPOINTS_ANSWER" = false ]; } || exit 1
  # Most pull requests leave the harnesses to parity-main, which runs them on main a batch of merges at a time
  # (.github/workflows/parity-main.yml; releases wait for it). A pull request still runs them itself when it changes
  # a harness, an oracle, a probe or the runner, or carries the run-parity label (run-parity.yml, when it is added).
  parity-scope:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    # A git diff of this repository's own branch: one of our small runners (horizon-light, docs/ci-runners.md).
    runs-on: ${{ vars.SELF_HOSTED_CI != 'off' && fromJSON('["self-hosted", "linux", "horizon-light"]') || 'blacksmith-2vcpu-ubuntu-2404' }}
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: |
          changed=$(git diff --name-only "$(git merge-base "$BASE_SHA" HEAD)" HEAD)
          harness=$(grep -E '^(tools/test_[a-z0-9_]+_parity\.py|tools/(parity[a-z_]*|lab)\.py|tools/parity_hosts\.json|mods/horizon/src/test/|crates/[^/]+/examples/|crates/myriade-engine/src/game/[a-z_]*(fixture|harness)\.rs|\.github/workflows/parity[a-z-]*\.yml)' <<< "$changed" || true)
          if [ -n "$harness" ] || [[ " $LABELS " == *" run-parity "* ]] || [[ " $LABELS " == *" frame-identity "* ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "The pull request runs its harnesses: ${harness:-label run-parity}"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No harness, oracle, probe or runner change: parity-main checks this on main"
          fi
  parity:
    needs: parity-scope
    if: needs.parity-scope.outputs.run == 'true'
    uses: ./.github/workflows/parity.yml
    with:
      base: ${{ github.event.pull_request.base.sha }}
      head: ${{ github.event.pull_request.head.sha }}
      full: ${{ contains(github.event.pull_request.labels.*.name, 'full-parity') }}
      frame_identity: ${{ contains(github.event.pull_request.labels.*.name, 'frame-identity') }}
  # JFR analysis uses JDK-generated fixture recordings on the self-hosted Linux runner.
  # Start a manual checks dispatch with: gh workflow run checks --ref <branch> -f jfr=true.
  jfr-analysis:
    if: github.event_name == 'workflow_dispatch' && inputs.jfr
    runs-on: [self-hosted, linux, horizon-game]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
      - name: Verify streaming JFR analysis against the JDK exporter
        run: python tools/test_jfr.py
      - name: Verify ZGC pause and allocation event interpretation
        run: python tools/test_jfr.py --gc zgc
