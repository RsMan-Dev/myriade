name: game build
# Builds the dedicated server from `ref`: the Java exporters, then the Linux server, glibc and musl, on GitHub. Called by
# nightly-build.yml (the Nightly, which release.yml starts), always from main's copy of this file: the caller's
# commit, never the one being built. It holds no secrets: signing the checksums is the callers' own job,
# which never runs what this one built. See docs/release-flow.md.
on:
  workflow_call:
    inputs:
      ref:
        description: The commit to build
        type: string
        required: true
      version:
        description: The version built in (HORIZON_VERSION), e.g. 0.2.81 or nightly-2026-10-28
        type: string
        required: true
      nightly:
        description: A nightly's "<date> <short sha>" (HORIZON_NIGHTLY), shown by the game; empty for a release
        type: string
        default: ''
      trusted:
        # No caller passes true today: release.yml starts nightly-build.yml, which passes false here. With false, the
        # build never runs on the release runner and never saves the Rust cache (its key is its own anyway). The
        # exporters' Mac jobs don't read machine-shared caches or cargo configuration from outside the checkout
        # (tools/ci/cargo_isolation.py; tests/test_nightly.py pins all of it).
        description: The source is main (a release); false for anything else (a nightly)
        type: boolean
        default: false
permissions:
  contents: read
env:
  # The class of the compile turns taken on the self-hosted Mac (tools/compile_lock.py), also for
  # tools/ci/vanilla-data.sh's preparer build. Elsewhere the turn is a no-op.
  HORIZON_COMPILE_LOCK_ROLE: build
jobs:
  wasm-std:
    # One shared std member, built without credentials or shared caches. Its symbol names don't depend on the host
    # (cargo-horizon-mod gives std crates a host-free disambiguator; wasm-std-hosts.yml checks Windows against Linux).
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - id: rust
        run: echo "version=$(cat tools/ci/rust-version)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          components: rust-src
          targets: wasm32-unknown-unknown
      - name: Build the shared wasm standard library
        run: |
          mkdir -p wasm-std
          cargo run --locked -p cargo-horizon-mod -- wasm-std wasm-std/horizon-wasm-std.wasm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wasm-std
          path: wasm-std/horizon-wasm-std.wasm
          if-no-files-found: error
          retention-days: 3

  exporters:
    # This runner holds the maintainer's own pinned Minecraft jars. Only our classes leave it. An untrusted build
    # goes to the Mac mini's nightly runner (macOS + horizon-nightly: ludovics-mac-mini-nightly, beside the one that
    # runs pull requests' parity jobs, so a nightly never waits behind their queue), never the release runner
    # (MAC_RUNNER: ludovics-mac-mini-release) nor parity-main's.
    runs-on: ${{ inputs.trusted && vars.MAC_RUNNER || fromJSON('["self-hosted", "macOS", "horizon-nightly"]') }}
    # Three full preparations (two isolated, one batched) besides the compile, and up to 60 min of waiting for turns
    # at compiling on the Mac (tools/compile_lock.py), shared by the job's compiles.
    timeout-minutes: 150
    env:
      # An empty RUSTC_WRAPPER also overrides a build.rustc-wrapper in any cargo config. The variables cargo_isolation.py
      # refuses may be set here only empty.
      RUSTC_WRAPPER: ''
      RUSTC_WORKSPACE_WRAPPER: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          clean: true
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-11
        with:
          toolchain: stable
      - name: A fresh cargo home and no cargo configuration from outside the checkout
        # The guard comes from this workflow's commit (GITHUB_WORKFLOW_SHA: the caller's, whose ./ copy of this file
        # runs), never from the checkout it checks, which may be an older commit without it. It is fetched into a new
        # folder and run by the system's own curl and Python (curl -q: no curlrc; python3 -I -S: no environment, no
        # site), and the step passes only when its last line says it finished.
        run: |
          set -euo pipefail
          [ -x /usr/bin/python3 ] || { echo "::error::/usr/bin/python3 is missing"; exit 1; }
          dir="$(/usr/bin/mktemp -d "$RUNNER_TEMP/workflow-tools.XXXXXX")"
          url="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_WORKFLOW_SHA/tools/ci/cargo_isolation.py"
          /usr/bin/curl -q --fail --silent --show-error --proto '=https' --proto-redir '=https' --max-redirs 0 \
            --noproxy '*' --max-time 60 --retry 5 -o "$dir/cargo_isolation.py" "$url"
          out="$(/usr/bin/python3 -I -S "$dir/cargo_isolation.py" "$GITHUB_WORKSPACE")" || { printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          [ "${out##*$'\n'}" = "cargo isolation: clean" ] || { echo "::error::the cargo guard did not finish"; exit 1; }
      - run: bash tools/ci/runner-env.sh
        env:
          # Nightly, dry-run and release Mac jobs don't read machine-shared caches: no sccache, and a fresh cargo home
          # per run (rustup's toolchains stay the machine's).
          HORIZON_NO_SCCACHE: '1'
      - run: bash tools/ci/vanilla-data.sh
      - name: The preparer, compiled in its turn
        shell: bash
        # target/ is gone after the clean checkout, and vanilla-data.sh builds the preparer only when it prepares
        # afresh. Its own step, exec'd, so a cancelled job's signals reach the turn's holder (tools/compile_lock.py).
        run: |
          [ -f tools/ci/compile-lock.sh ] || { echo "  compile lock: this ref has no tools/ci/compile-lock.sh: compiling without a turn"; exec cargo build --release --locked -p horizon-prepare; }
          exec bash tools/ci/compile-lock.sh build -- cargo build --release --locked -p horizon-prepare
      - name: Compile and validate original exporters against the pinned jars
        shell: bash
        run: |
          set -euo pipefail
          # Compiled here, never taken from the runner's shared preparations: pull requests' parity jobs
          # write those (vanilla-data.sh links .local/exporters to them).
          rm -rf .local/exporters
          bundle=$(target/release/horizon-prepare compile-exporters --root "$PWD" | tail -1)
          mkdir -p exporters
          cp -R "$bundle/server" "$bundle/client" "$bundle/manifest.json" exporters/
          # Only our classes and their manifest leave this runner.
          stray=$(find exporters -type f ! -path exporters/manifest.json \
            ! \( -name '*.class' \( -path 'exporters/server/dev/horizonlab/parity/*' -o -path 'exporters/client/dev/horizonlab/parity/*' \) \))
          [ -z "$stray" ] || { echo "::error::not one of our classes: $stray"; exit 1; }
          python3 tools/check_prepare_exporters.py --binary target/release/horizon-prepare
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: original-exporters
          path: exporters/
          if-no-files-found: error
          retention-days: 3
      - name: The run's cargo home removed
        if: always()
        run: rm -rf "$RUNNER_TEMP/cargo-home"

  build:
    needs: [exporters, wasm-std]
    name: build ${{ matrix.name }}
    # Linux musl is new: a failure never holds the release (the signing job needs this job, and a failed entry of it
    # would fail it). The release steps leave the missing optional archive out with a warning.
    continue-on-error: ${{ matrix.name == 'linux-musl' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            dir: horizon-server-linux-x86_64
            asset: horizon-server-linux-x86_64.tar.gz
          - name: linux-musl
            os: ubuntu-22.04
            musl: true
            dir: horizon-linux-musl-x86_64
            asset: horizon-linux-musl-x86_64.tar.gz
    runs-on: ubuntu-22.04
    # The hosted Linux release builds took 35–40 min on 2026-11-18 (run 44227464218), past the old 40.
    timeout-minutes: 75
    env:
      # The release's version, built in (horizon_core::release): --version, user agents, crash reports and
      # telemetry say it. No version-bump commits.
      HORIZON_VERSION: ${{ inputs.version }}
      # A nightly's date and commit ("2026-10-28 0c02067"), which the game shows; empty for a release.
      HORIZON_NIGHTLY: ${{ inputs.nightly }}
      # Where cargo puts the programs.
      BIN: target/release
      # As in `exporters`.
      RUSTC_WRAPPER: ''
      RUSTC_WORKSPACE_WRAPPER: ''
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          # Always from a clean checkout: nothing a previous run left (target/, an untracked .cargo/config.toml, a build
          # script's output) may end up in a release. target/ is rebuilt from scratch.
          clean: true
      - id: rust
        run: echo "version=$(cat tools/ci/rust-version)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-11
        with:
          toolchain: ${{ steps.rust.outputs.version }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: ${{ !matrix.musl }}
        with:
          # A release restores only what a release saved: an untrusted build has its own key and saves nothing.
          shared-key: ${{ inputs.trusted && 'release' || 'nightly' }}-${{ matrix.name }}
          save-if: ${{ inputs.trusted }}
      - name: Build horizon-prepare and horizon-server
        if: ${{ !matrix.musl }}
        run: cargo build --release --locked -p horizon-prepare --bin horizon-prepare -p horizon-server --bin horizon-server
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-std
          path: wasm-std
      - name: Install the shared wasm standard library beside the programs
        if: ${{ !matrix.musl }}
        run: cp wasm-std/horizon-wasm-std.wasm "$BIN/horizon-wasm-std.wasm"
      - name: Every program starts
        if: ${{ !matrix.musl }}
        run: |
          set -euo pipefail
          # The version is the release's.
          for binary in horizon-prepare horizon-server; do
            out=$("$BIN/$binary" --version | tr -d '\r')
            echo "$out"
            [[ "$out" == "$binary $HORIZON_VERSION" ]] || { echo "::error::expected $binary $HORIZON_VERSION"; exit 1; }
          done
          "$BIN/horizon-prepare" --help | grep -q -- '--minecraft-dir'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: original-exporters
          path: exporters
      - name: Build, check and package for musl in Alpine
        if: matrix.musl
        # Run Docker on the Ubuntu host: JavaScript actions themselves require glibc.
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            -e HORIZON_VERSION -e HORIZON_NIGHTLY \
            rust:alpine3.22 sh tools/ci/build-musl.sh
      - name: The server build (the dedicated game, as horizon-engine), and the release folder
        if: ${{ !matrix.musl }}
        run: |
          set -euo pipefail
          cargo build --release --locked -p horizon-game --no-default-features --bin myriade-engine
          python3 tools/check_cpu_baseline.py "$BIN/myriade-engine" "$BIN/horizon-prepare" "$BIN/horizon-server"
          cargo run --locked -p xtask -- package-server "$BIN/myriade-engine" "dist/${{ matrix.dir }}"
          folder="dist/${{ matrix.dir }}"
          python3 tools/check_imports.py --server "$folder/horizon-engine" "$folder/horizon-server" "$folder/horizon-prepare"
          "$folder/horizon-engine" --help | grep -q -- '--resources'
          [[ "$("$folder/horizon-server" --version)" == "horizon-server $HORIZON_VERSION" ]]
          cd dist
          rm -f "${{ matrix.asset }}"
          tar czf "${{ matrix.asset }}" "${{ matrix.dir }}"
          ls -l "${{ matrix.asset }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 3
