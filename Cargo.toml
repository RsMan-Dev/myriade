[workspace]
exclude = ["crates/horizon-telemetry-server", "launcher", "crates/horizon-mod-registry", "third_party/libmimalloc-sys", "tools/fixtures/paper-trace-mod"]
members = [
    "crates/horizon-guest-stack",
    "crates/horizon-game-discovery",
    "crates/horizon-hooks",
    "crates/horizon-game",

    "crates/horizon-core",
    "crates/horizon-platform",
    "crates/horizon-addresses",
    "crates/horizon-threads",
    "crates/horizon-world",
    "crates/myriade-engine",
    "crates/myriade-engine-lib",
    "crates/horizon-ecs-proto",
    "crates/horizon-gameplay",
    "crates/myriade-data",
    "crates/myriade-types",
    "crates/myriade-level",
    "crates/horizon-command",
    "crates/horizon-items",
    "crates/horizon-server-files",
    "crates/horizon-java-properties",
    "crates/horizon-anticheat",
    "crates/horizon-chat-filter",
    # The Model Context Protocol, used by horizon-server.
    "crates/horizon-mcp",
    "crates/horizon-server",
    "crates/myriade-bot",
    "crates/horizon-server-launch",
    "crates/horizon-assets",
    "crates/horizon-protocol",
    "crates/horizon-theme",
    "crates/horizon-prepare",
    "crates/horizon-system",
    "crates/horizon-bench",
    "crates/horizon-perf-format",
    "crates/horizon-release-sign",
    "xtask",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "LGPL-3.0-or-later"
rust-version = "1.95"

# Ports mirror vanilla's Java signatures, index loops and nested generic types
# one to one so they can be checked against the decompiled sources.
[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
needless_range_loop = "allow"
large_enum_variant = "allow"

[patch.crates-io]
# libmimalloc-sys 0.1.49 whose mimalloc v3 counts bits without POPCNT when MSVC builds it: the
# game died before main on CPUs without it (Core 2, #7264; THIRD_PARTY_NOTICES.md). Drop this and
# the folder once a libmimalloc-sys release has microsoft/mimalloc#1291's fix.
libmimalloc-sys = { path = "third_party/libmimalloc-sys" }

# Line tables keep file:line in backtraces; full debug info made every
# example and test binary hundreds of megabytes and slow to link.
[profile.dev]
debug = "line-tables-only"

# The 512 MiB jar-boundary test still hashes every byte; run the hash kernel optimized.
# Likewise, the API generator repeatedly parses the game's sources with syn.
# These dependencies stay cached in CI, unlike workspace test binaries.
[profile.dev.package.sha2]
opt-level = 3

# Fixture tests compile real wasm modules with Cranelift at runtime. Keep the
# compiler optimized without optimizing (or weakening) the tests themselves.
[profile.dev.package.wasmtime]
opt-level = 3
[profile.dev.package.cranelift-codegen]
opt-level = 3

# Packaging validates each real module repeatedly. Optimize the validator, not
# the fixture or guest code (which use their separate horizon-wasm profile).
[profile.dev.package.wasmparser]
opt-level = 3

[profile.dev.package.syn]
opt-level = 3
# The perf-format tests gzip over 512 MiB; unoptimized deflate took most of their time.
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.proc-macro2]
opt-level = 3
[profile.release.package.syn]
opt-level = 3
[profile.release.package.proc-macro2]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

# Optimized but quick-to-link builds for iteration: cargo build --profile fast
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
