[package]
name = "myriade-engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Horizon native development client"
autobins = false
autoexamples = false
autotests = false

[build-dependencies]
horizon-game-discovery = { path = "../horizon-game-discovery" }

[dependencies]
bevy_ecs = { version = "0.20.1", default-features = false, features = ["std"] }
horizon-guest-stack = { path = "../horizon-guest-stack" }
horizon-hooks = { path = "../horizon-hooks" }
myriade-engine-lib = { path = "../myriade-engine-lib", default-features = false }
horizon-gameplay = { path = "../horizon-gameplay" }
horizon-assets = { path = "../horizon-assets" }
myriade-data = { path = "../myriade-data" }
myriade-level = { path = "../myriade-level" }
horizon-command = { path = "../horizon-command" }
horizon-items = { path = "../horizon-items" }
horizon-core = { path = "../horizon-core" }
myriade-types = { path = "../myriade-types" }
horizon-ecs-proto = { path = "../horizon-ecs-proto" }
# OptiFine-format pack files: custom entity models, random entity textures.
# The server thread ahead of the workers (MinecraftServer.spin's Thread.setPriority).
horizon-threads = { path = "../horizon-threads" }
horizon-perf-format = { path = "../horizon-perf-format" }
horizon-world = { path = "../horizon-world" }
horizon-protocol = { path = "../horizon-protocol" }
# server.properties, eula.txt and the user lists, shared with horizon-server.
horizon-server-files = { path = "../horizon-server-files" }
# The JDK's clock, for the LAN host's random seed and the probes.
horizon-java-properties = { path = "../horizon-java-properties" }
# The dedicated server's anticheat, off unless server.toml's [anticheat] turns it on (docs/anticheat.md).
horizon-anticheat = { path = "../horizon-anticheat" }
# The dedicated server's chat filter: [chat_filter], the slur list, mutes (docs/chat-filter.md);
# `entry` installs it into the engine's hook (`horizon_server_files::chat_guard`).
horizon-chat-filter = { path = "../horizon-chat-filter" }
# Horizon mods: sandboxed WebAssembly components, off unless installed and turned on (docs/modding/src/how-to/content-mods.md).
# Their runtime is the `mods` feature.
glam = "0.30"
png = "0.18"
sha2 = "0.10.9"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
# server.toml's [combat], which the dedicated server reads itself.
toml = "1.1"
# hlsl-out: the gfx.rs tests translate every shader as wgpu's DirectX 12 backend does. A normal feature,
# not a dev-dependency's, so builds, tests and examples share one build of naga, wgpu and this crate.
log = "0.4"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs", "runtime_detection"] }
# Opt-in data collection: the game keeps, the launcher sends (docs/telemetry.md). The
# anonymous "I'm playing" ping is the Horizon layer's (`horizon-heartbeat`, in the official executable).
horizon-bench = { path = "../horizon-bench" }
crc32fast = "1"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
# `LevelStorageAccess.estimateDiskSpace`: usable disk space, without unsafe code on Windows.
fs4 = { version = "1.1.0", default-features = false, features = ["sync"] }
# Mod file roots are descriptor-bound: no symlink race can leave a mod's area.
cap-std = "3"
cap-fs-ext = "3"

[target.'cfg(unix)'.dependencies]
# The server thread's CPU time per tick (`HORIZON_SPIKES`, spans.rs).
rustix = { version = "1", default-features = false, features = ["std", "time", "process", "fs"] }


[features]
default = []
# Scoped trait-mod installation for a mod's own tests.
testing = []
# Per-level-tick state digest for determinism checks (game/state_digest.rs).
state-digest = []
# Records the call sites of mob random draws (`mob_ai_probe` traces).
rng-trace = ["horizon-core/rng-trace", "myriade-engine-lib/rng-trace"]
# myriade-engine-lib's own `default`: what `-p myriade-engine-lib` on the command line turns on. horizon-game's default asks for it, so the game
# built with and without `-p myriade-engine-lib` (parity's two selections) is one build, not two.
engine-lib-default = ["myriade-engine-lib/default"]
# Rust's allocations go to the system heap instead of mimalloc, where heap profilers that replace
# malloc (heaptrack, valgrind's massif) see them. Also the Windows and macOS prebuilt archives' allocator
# (tools/prebuilt_game.py, arismoko/horizon#2394, arismoko/horizon#3877): there std's shared library keeps its own allocator. Otherwise mimalloc is faster.
system-allocator = ["horizon-threads/system-allocator"]
# mimalloc that counts each thread's allocations and frees (`stats` replies with `alloc`).
alloc-count = ["horizon-threads/alloc-count"]
# mimalloc with a tag on each block: `the control socket's memory command` lists the live heap by startup step and
# thread (`heap_by_tag_mb`). For measuring only: each block costs 16 bytes more.
alloc-census = ["horizon-threads/alloc-census"]

[[test]]
name = "it"
path = "tests/it/main.rs"

[lints]
workspace = true

[dev-dependencies]
myriade-data = { path = "../myriade-data", features = ["test-language-publication"] }
myriade-engine-lib = { path = "../myriade-engine-lib", default-features = false, features = ["test-payload-probe", "test-publication-scope", "test-residency-observer"] }
wat = "1.261"
tempfile = "3"
horizon-threads = { path = "../horizon-threads", features = ["test-allocation-count"] }
myriade-level = { path = "../myriade-level", features = ["test-support"] }
horizon-items = { path = "../horizon-items", features = ["test-support"] }
horizon-gameplay = { path = "../horizon-gameplay", features = ["test-support"] }
# Every WGSL shader translated as wgpu's DirectX 12 backend does (gfx.rs tests).
