[package]
name = "horizon-game"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The dedicated server executable (`horizon-client`): the engine's entry with the platform's parts registered"

[dependencies]
horizon-guest-stack = { path = "../horizon-guest-stack" }
horizon-client = { path = "../horizon-client", default-features = false }
horizon-mod-package = { path = "../horizon-mod-package", default-features = false, features = ["index"] }

horizon-engine-slots = { path = "../horizon-engine-slots" }
mod-points = { package = "horizon-mod-points", path = "../horizon-mod-points" }
horizon-mod-wasm = { path = "../horizon-mod-wasm" }
mod-api = { package = "horizon-mod-api", path = "../horizon-mod-api" }

libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[lints]
workspace = true

# The binary holds no tests (the library does): `cargo test` builds no empty test harness for it, which linked the
# whole crate again. It still builds for integration tests (CARGO_BIN_EXE_*) and clippy --all-targets.
[[bin]]
name = "horizon-client"
path = "src/main.rs"
test = false

[features]
# horizon-client/client-lib-default: one build of the server whether or not horizon-client-lib is also named.
default = ["horizon-client/client-lib-default"]
testing = ["horizon-client/testing"]
rng-trace = ["horizon-client/rng-trace"]
system-allocator = ["horizon-client/system-allocator"]
alloc-census = ["horizon-client/alloc-census"]
alloc-count = ["horizon-client/alloc-count"]

[dev-dependencies]
horizon-protocol = { path = "../horizon-protocol" }
tempfile = "3"
horizon-core = { path = "../horizon-core" }
serde_json = "1"
