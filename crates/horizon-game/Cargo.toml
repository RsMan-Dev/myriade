[package]
name = "horizon-game"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The dedicated server executable (`myriade-engine`): the engine's entry with the platform's parts registered"

[dependencies]
horizon-guest-stack = { path = "../horizon-guest-stack" }
myriade-engine = { path = "../myriade-engine", default-features = false }


serde_json = "1"

[lints]
workspace = true

# The binary holds no tests (the library does): `cargo test` builds no empty test harness for it, which linked the
# whole crate again. It still builds for integration tests (CARGO_BIN_EXE_*) and clippy --all-targets.
[[bin]]
name = "myriade-engine"
path = "src/main.rs"
test = false

[features]
# myriade-engine/engine-lib-default: one build of the server whether or not myriade-engine-lib is also named.
default = ["myriade-engine/engine-lib-default"]
testing = ["myriade-engine/testing"]
rng-trace = ["myriade-engine/rng-trace"]
system-allocator = ["myriade-engine/system-allocator"]
alloc-census = ["myriade-engine/alloc-census"]
alloc-count = ["myriade-engine/alloc-count"]

[dev-dependencies]
horizon-protocol = { path = "../horizon-protocol" }
tempfile = "3"
horizon-core = { path = "../horizon-core" }
serde_json = "1"
