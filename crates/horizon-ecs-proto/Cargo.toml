[package]
name = "horizon-ecs-proto"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Prototype: a cow as a bevy_ecs herd (data components, batch systems, sleeping), with Horizon's real block collision kernel (suivi/ecs-prototype.md section 12)"

[dependencies]
bevy_ecs = { version = "0.20.1", default-features = false, features = ["std", "multi_threaded"] }
bevy_tasks = { version = "0.20.1", default-features = false, features = ["multi_threaded"] }
horizon-client-render = { path = "../horizon-client-render" }
horizon-core = { path = "../horizon-core" }
horizon-world = { path = "../horizon-world" }
